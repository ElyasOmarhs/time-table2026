name: Build Smart Timetable EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React App (Vite)
        run: npx vite build --base=./
        
      - name: Setup Desktop Files
        run: |
          $mainJs = @"
          const { app, BrowserWindow } = require('electron');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1024,
              height: 768,
              autoHideMenuBar: true,
              webPreferences: { nodeIntegration: true }
            });
            win.loadFile('dist/index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@
          Set-Content -Path main.js -Value $mainJs

          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg | Add-Member -MemberType NoteProperty -Name "main" -Value "main.js" -Force
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

          $builderConfig = @"
          appId: com.smartschool.timetable
          productName: هوښیار مهالویش
          directories:
            output: release
          files:
            - dist/**/*
            - main.js
            - package.json
          win:
            target: nsis
            icon: icon.ico
          "@
          Set-Content -Path electron-builder.yml -Value $builderConfig

      - name: Install Electron
        run: npm install electron electron-builder --save-dev

      - name: Build EXE File
        run: npx electron-builder --win -c electron-builder.yml

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hoshyar-Mahalwesh-App
          path: release/*.exe
          retention-days: 5
